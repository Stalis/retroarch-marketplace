name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Manual version override (e.g. v1.0.0). Leave empty for auto-semver.'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install web dependencies
        run: make admin-install

      - name: Run frontend tests
        run: make admin-test

      - name: Run Go vet
        run: make vet

      - name: Run Go unit tests
        run: make test

      - name: Run E2E tests
        run: make e2e

  release:
    name: Create Release & Binaries
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
      skipped: ${{ steps.version.outputs.skipped }}
    steps:
      - name: Checkout full git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "Using manual version override: ${{ github.event.inputs.version }}"
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force
          current_tag=$(git tag --points-at HEAD | grep '^v[0-9]' | head -n 1 || true)
          if [ -n "$current_tag" ]; then
            echo "HEAD already tagged as $current_tag; skipping duplicate release."
            echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag -l "v[0-9]*" --sort=-v:refname | head -n 1 || true)

          if [ -z "$latest_tag" ]; then
            next_tag="v1.0.0"
          else
            ver="${latest_tag#v}"
            major=$(echo "$ver" | cut -d. -f1)
            minor=$(echo "$ver" | cut -d. -f2)
            patch=$(echo "$ver" | cut -d. -f3)

            commits=$(git log "${latest_tag}..HEAD" --format="%s%b")

            if echo "$commits" | grep -Eq 'BREAKING[ -]CHANGE|^[a-zA-Z]+(\([a-zA-Z0-9_-]+\))?!:'; then
              major=$((major + 1))
              minor=0
              patch=0
            elif echo "$commits" | grep -Eq '^feat(\([a-zA-Z0-9_-]+\))?:'; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            next_tag="v${major}.${minor}.${patch}"
          fi

          echo "Determined next tag: $next_tag"
          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        if: steps.version.outputs.skipped != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Set up Node.js
        if: steps.version.outputs.skipped != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Build frontend
        if: steps.version.outputs.skipped != 'true'
        run: |
          make admin-install
          make admin-build

      - name: Build multi-platform desktop binaries
        if: steps.version.outputs.skipped != 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p release-assets bin

          platforms=(
            "darwin/amd64/catalog-server-${TAG}-darwin-amd64"
            "darwin/arm64/catalog-server-${TAG}-darwin-arm64"
            "linux/amd64/catalog-server-${TAG}-linux-amd64"
            "linux/arm64/catalog-server-${TAG}-linux-arm64"
            "windows/amd64/catalog-server-${TAG}-windows-amd64"
            "windows/arm64/catalog-server-${TAG}-windows-arm64"
          )

          for p in "${platforms[@]}"; do
            IFS='/' read -r target_os target_arch archive_name <<< "$p"
            bin_name="catalog-server"
            if [ "$target_os" = "windows" ]; then
              bin_name="catalog-server.exe"
            fi

            echo "Building $target_os/$target_arch..."
            CGO_ENABLED=0 GOOS=$target_os GOARCH=$target_arch go build -tags release -ldflags="-s -w" -o "bin/${bin_name}" .

            if [ "$target_os" = "windows" ]; then
              (cd bin && zip -9 "../release-assets/${archive_name}.zip" "${bin_name}")
            else
              tar -czf "release-assets/${archive_name}.tar.gz" -C bin "${bin_name}"
            fi

            rm -f "bin/${bin_name}"
          done

          (cd release-assets && sha256sum * > checksums.txt)

      - name: Create GitHub Release
        if: steps.version.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --target "${{ github.sha }}" \
            --generate-notes

  docker:
    name: Build & Push Docker Image
    needs: release
    if: needs.release.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
