openapi: 3.0.3
security: []
info:
  title: RetroArch Content Catalog API
  version: 1.0.0
  description: |
    Public client contract of the catalog server. Companion to CONTENT_CATALOG_PROTOCOL.md,
    which documents what the RetroArch client parses. The loopback-only admin API
    (/api/admin/*, /admin/) is intentionally not part of this spec.

    Client-side validation rules not expressible in OpenAPI:
    - `files` entries and `entrypoint` are relative, slash-separated paths: no `.`/`..`
      components, no empty components, no backslashes, colons or control bytes.
    - `id` and `platform.libretro_name` must not contain `/`.
    - `entrypoint` must occur exactly once in `files`; `id` is unique across the response.
    - The package ZIP members must equal `files` exactly.
servers:
  - url: http://127.0.0.1:5050
paths:
  /api/games:
    get:
      operationId: listGames
      summary: List game cards
      description: Filters combine with AND. `skip` and `count` apply after filtering.
      parameters:
        - name: q
          in: query
          description: Unicode case-insensitive substring match on `canonical_name` and `display_name`.
          schema: { type: string }
        - name: platform
          in: query
          description: Exact match on `platform.libretro_name`.
          schema: { type: string }
        - name: skip
          in: query
          description: Number of matching games to skip.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: count
          in: query
          description: Maximum number of games to return. Omitted means no limit.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Top-level JSON array; `[]` when nothing matches.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Game" }
        "400":
          description: Malformed query string, or non-integer / negative `skip` or `count`.
          content:
            text/plain:
              schema: { type: string }
        "500":
          description: Manifest is invalid.
          content:
            text/plain:
              schema: { type: string }
  /api/platforms:
    get:
      operationId: listPlatforms
      summary: List platforms that have at least one game
      description: Used by the RetroArch menu to group downloads. `libretro_name` is the value accepted by the `platform` filter of `/api/games`.
      responses:
        "200":
          description: Top-level JSON array of platforms with unique `libretro_name`; `[]` when the catalog is empty.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Platform" }
        "500":
          description: Manifest is invalid.
          content:
            text/plain:
              schema: { type: string }
  /api/packages/{package}:
    get:
      operationId: downloadPackage
      summary: Download a game package
      description: The `download_url` of a card resolves to this path. Built lazily and cached.
      parameters:
        - name: package
          in: path
          required: true
          description: Game `id`, URL-escaped, followed by `.zip` (e.g. `kings-field-psx.zip`).
          schema: { type: string }
      responses:
        "200":
          description: ZIP whose members match the card's `files` exactly.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { description: Unknown id. }
        "500": { description: Package could not be built. }
  /assets/cores/.index-dirs:
    get:
      operationId: assetsPlatformIndex
      summary: Platform directories (RetroArch Content Downloader)
      responses:
        "200":
          description: Newline-delimited platform directory names.
          content:
            application/octet-stream:
              schema: { type: string }
  /assets/cores/{platform}/.index:
    get:
      operationId: assetsGameIndex
      summary: Archives available for a platform
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Newline-delimited `<game>.zip` names.
          content:
            application/octet-stream:
              schema: { type: string }
        "404": { description: Unknown platform. }
  /assets/cores/{platform}/{archive}:
    get:
      operationId: assetsDownloadGame
      summary: Game ZIP with content nested in a `<game>/` subdirectory
      parameters:
        - { name: platform, in: path, required: true, schema: { type: string } }
        - { name: archive, in: path, required: true, description: "Game name or id followed by `.zip`.", schema: { type: string } }
      responses:
        "200":
          description: ZIP archive.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { description: Unknown platform or game. }
components:
  schemas:
    Platform:
      type: object
      required: [id, name, libretro_name]
      properties:
        id: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        libretro_name:
          type: string
          minLength: 1
          description: Platform/core-assets subdirectory and playlist stem. No `/`.
          example: "Sony - PlayStation"
    Game:
      type: object
      required: [id, canonical_name, platform, entrypoint, files, download_url]
      properties:
        id:
          type: string
          minLength: 1
          description: Install directory name. Unique in the response. No `/`.
          example: kings-field-psx
        canonical_name: { type: string, minLength: 1, example: "King's Field" }
        display_name: { type: string, minLength: 1, example: "King's Field (USA)" }
        platform: { $ref: "#/components/schemas/Platform" }
        entrypoint:
          type: string
          minLength: 1
          description: Relative path; must be one of `files`.
          example: Kings Field (USA).cue
        files:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, minLength: 1 }
        download_url:
          type: string
          minLength: 1
          description: Resolved against the catalog URL.
          example: packages/kings-field-psx.zip
        boxart_url:
          type: string
          minLength: 1
          description: Optional. Not consumed by the current RetroArch client.
